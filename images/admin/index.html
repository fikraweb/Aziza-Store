<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow">
  <title>لوحة إدارة عزيزة ستور</title>
  <link rel="stylesheet" href="/images/admin/admin.css">
  <script type="module" src="/images/admin/admin.js"></script>
</head>
<body>
  <header><div><a href="/">عزيزة ستور</a><span>لوحة الإدارة</span></div><button id="logout" hidden>تسجيل الخروج</button></header>
  <main>
    <section id="signin" class="panel login" hidden>
      <h1>دخول الإدارة</h1>
      <form id="login">
        <label for="password">كلمة المرور</label>
        <input id="password" name="password" type="password" autocomplete="current-password" required>
        <button>دخول</button>
      </form>
      <p id="login-status" role="status"></p>
    </section>
    <section id="dashboard" hidden>
      <nav aria-label="أقسام الإدارة">
        <a href="#overview">الإحصائيات</a><a href="#settings">إعدادات المتجر</a><a href="#products">المنتجات</a><a href="#orders">الطلبات</a>
      </nav>
      <section id="overview" class="panel"><h1>نظرة عامة</h1><div id="stats" class="stats"></div><div id="visits"></div></section>
      <section id="settings" class="panel">
        <h2>إعدادات المتجر</h2>
        <form id="settings-form" class="fields">
          <label>اسم المتجر <input name="name" required maxlength="60"></label>
          <label>عنوان الواجهة <input name="headline" required maxlength="70"></label>
          <label>تكملة العنوان <input name="emphasis" required maxlength="35"></label>
          <label>وصف الواجهة <textarea name="description" required maxlength="240" rows="3"></textarea></label>
          <label>رقم واتساب مع مفتاح البلد <input name="whatsapp" dir="ltr" inputmode="numeric" pattern="[1-9][0-9]{7,14}" placeholder="212…"></label>
          <label class="check"><input name="ordering" type="checkbox"> فتح الطلبات</label>
          <button>حفظ الإعدادات</button>
          <p class="note">إلا خليتي رقم واتساب خاوي، المتجر كيبقى فالوضع التجريبي.</p>
          <p role="status"></p>
        </form>
      </section>
      <section id="products" class="panel">
        <h2>المنتجات</h2>
        <label>البحث عن منتج <input type="search" id="product-search"></label>
        <div id="product-list" class="product-list"></div>
      </section>
      <section id="orders" class="panel">
        <h2>الطلبات</h2>
        <p class="note">الطلب المجهّز كيتسجّل قبل الإرسال فواتساب. بدّل الحالة من بعد ما تتأكد من الزبون.</p>
        <div id="order-list"></div>
      </section>
    </section>
  </main>
</body>
</html>
